# .cnb.yml — home-workbench 部署流水线
#
# 触发：
#   main 分支 push  → 把静态文件同步到国内节点主机，由该机 Caddy 托管
#   api_trigger     → 同一条流水线，用于不改动代码时手动重新部署
#
# 密钥：目标主机信息与 SSH 私钥全部来自 CNB 密钥仓库，通过 imports 注入为环境变量，
#       **本仓库不硬编码任何主机地址、路径或凭据**。密钥文件需包含以下字段：
#         DEPLOY_HOST          目标主机地址
#         DEPLOY_USER          登录用户
#         DEPLOY_PATH          静态文件目标目录
#         DEPLOY_SSH_KEY_B64   SSH 私钥的 base64 编码（单行，规避多行值注入问题）
#
# ⚠️ 坑位记录：CNB 构建环境会吃掉 script 块里的续行反斜杠 ——
#    "tar czf - \" 这种写法会被截断为单独一行执行，报 "Cowardly refusing to create an empty archive"。
#    （多行 if/fi 块正常，仅 "\" + 换行 被破坏。）
#    因此真正的部署逻辑放在仓库内的 deploy/sync.sh，流水线只负责调用它。

main:
  push:
    - name: deploy-static-site
      imports:
        - https://cnb.cool/scriptsmay/deploy-secrets/-/blob/main/home-workbench.yml
      stages:
        - name: deploy
          script: bash deploy/sync.sh
      failStages:
        - name: notify-failure
          script: echo "静态站部署失败：$CNB_BUILD_FAILED_MSG"

  api_trigger:
    - name: deploy-static-site
      imports:
        - https://cnb.cool/scriptsmay/deploy-secrets/-/blob/main/home-workbench.yml
      stages:
        - name: deploy
          script: bash deploy/sync.sh
      failStages:
        - name: notify-failure
          script: echo "静态站部署失败：$CNB_BUILD_FAILED_MSG"
