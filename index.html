<title>暖心小屋 · 家庭用品工作台</title>
<!--
  暖心小屋 · 单文件家庭用品工作台
  ------------------------------------------------------------------
  · 零依赖、零构建、零联网：双击即可用，数据全部存在本机浏览器
  · 4 个页签：今日 / 要买什么 / 家里有啥 / 快过期了，外加一个设置页
  · 库存两种记法：记数量（抽纸 3 包）或 只记状态（充足/不多了/没了）
  · 导出：每模块 CSV（带 UTF-8 BOM）/ 全量 CSV / 全量 JSON 备份与还原
  · 新增页签：在 JS 的 MODULES 表里加一项即可，无需改动其它代码
  · 电脑（>=768px）左侧导航；手机（<768px）底部四个大按钮
  · 多设备同步：CloudBase（上海体验环境 trial-sh-d1gqznm4577d6a062）
-->
<script src="cloudbase.full.js"></script>
<link rel="stylesheet" href="style.css">

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="dot">
        <svg viewBox="0 0 32 32" width="24" height="24" fill="none" stroke="#4B3F35" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      </div>
      <div>
        <h1 id="brandTitle">暖心小屋</h1>

      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="tab" data-goto="__settings">
        <span class="glyph" data-icon="settings"></span><span class="label">设置 · 导出</span>
      </button>
    </div>
  </aside>
  <main class="main">
    <!-- 卡纸上的手绘涂鸦（纯装饰，不参与交互） -->

      <!-- 太阳： rays + 笑脸 -->
      <svg class="doodle-sun" viewBox="0 0 140 140" fill="none">
        <g stroke="#4B3F35" stroke-width="2.6" stroke-linecap="round">
          <circle cx="68" cy="66" r="34" fill="#FFD35C"/>

        </g>
        <g fill="#4B3F35"><circle cx="58" cy="62" r="3.4"/><circle cx="79" cy="62" r="3.4"/></g>
        <path d="M56 78c4 5 20 5 24 0" stroke="#4B3F35" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="46" cy="76" r="5" fill="#FFA878" opacity=".75"/>
        <circle cx="91" cy="76" r="5" fill="#FFA878" opacity=".75"/>
      </svg>
      <!-- 云 -->
      <svg class="doodle-cloud-a" viewBox="0 0 120 62" fill="none">
        <path d="M24 52c-11 0-19-7-19-16S13 20 24 20c2-11 11-18 21-18 9 0 17 5 21 12 3-3 7-5 12-5 10 0 18 8 18 18 0 1 0 2-.3 3 6 2 10 7 10 12 0 8-7 14-17 14z"
              fill="#FFFFFF" stroke="#4B3F35" stroke-width="2.4" stroke-linejoin="round"/>
      </svg>
      <svg class="doodle-cloud-b" viewBox="0 0 120 62" fill="none">
        <path d="M24 52c-11 0-19-7-19-16S13 20 24 20c2-11 11-18 21-18 9 0 17 5 21 12 3-3 7-5 12-5 10 0 18 8 18 18 0 1 0 2-.3 3 6 2 10 7 10 12 0 8-7 14-17 14z"

      </svg>
      <!-- 草叶 -->
      <svg class="doodle-leaf" viewBox="0 0 130 120" fill="none">
        <g stroke="#4B3F35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 116C12 74 28 44 58 30" fill="#A4CE7B"/>
          <path d="M58 30c4-18 20-28 34-24 12 4 16 18 10 30-8 16-28 14-44-6z" fill="#8FD9C2"/>

          <path d="M70 106c2-20 14-34 30-38" fill="#FFD35C" opacity=".9"/>
        </g>
      </svg>
      <!-- 小花 -->
      <svg class="doodle-flower" viewBox="0 0 120 90" fill="none">
        <g stroke="#4B3F35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 86c0-18 2-32 6-42" fill="none"/>
          <circle cx="30" cy="34" r="13" fill="#FF9EBB"/>
          <circle cx="30" cy="34" r="4.5" fill="#FFD35C"/>
          <path d="M64 86c0-14 1-26 4-34" fill="none"/>
          <circle cx="68" cy="42" r="11" fill="#FFD35C"/>
          <circle cx="68" cy="42" r="4" fill="#E58C66"/>

          <circle cx="99" cy="50" r="9" fill="#BCA6EA"/>
          <circle cx="99" cy="50" r="3.4" fill="#FFEDB8"/>
        </g>
      </svg>
      <!-- 星星点点 -->
      <svg class="doodle-stars" viewBox="0 0 120 120" fill="none">
        <g stroke="#4B3F35" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 34l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#FFEDB8"/>
          <path d="M76 20l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#FF9EBB"/>
          <path d="M52 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#9ED1F2"/>
        </g>
      </svg>
    </div>
    <header class="topbar">
      <div class="tb-left">
        <h2 id="pageTitle">今日</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="tb-right">
        <div class="actions" id="pageActions"></div>
        <button class="iconbtn settings-mobile" id="settingsBtn" data-goto="__settings" aria-label="设置"></button>
      </div>
    </header>
    <section class="view" id="viewEl"><div class="view-inner" id="viewRoot"></div></section>
    <nav class="tabbar" id="tabbar"></nav>
  </main>
